# CI (Sprint 22): a cada push no master e em pull requests, confere lint,
# testes e build de produção. O build roda sem as variáveis do Supabase (modo
# demonstração), então o CI não precisa de nenhum segredo.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Um push novo no mesmo ramo cancela a rodada anterior, que ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Mesma versão principal da máquina de desenvolvimento (engines: >= 22.12).
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # Cache do build do Next (recomendação de node_modules/next/dist/docs/01-app/02-guides/ci-build-caching.md).
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', '*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
